<svg width="57" height="48" viewBox="0 0 57 48" fill="none" xmlns="http://www.w3.org/2000/svg">
 <defs>
<style type="text/css">
#person {
	animation: .5s linear infinite normal forwards running person;
	transform-box: fill-box;
	scale: 3;
}
@keyframes person {
	0% {
		transform: translateX(0px);
	}
}

#Group_32 {
	animation: .5s linear infinite normal forwards running Group_32;
	transform-box: fill-box;
	transform-origin: 50% 50%
}
@keyframes Group_32 {
	0% {
		transform: rotate(0deg);
	}
	50% {
		transform: rotate(-10.16deg);
	}
	100% {
		transform: rotate(10.16deg);
	}
}
#Star_1 {
	animation: .5s linear infinite normal forwards running Star_1;
	transform-box: fill-box;
	transform-origin: 50% 50%
}
@keyframes Star_1 {
	0% {
		transform: translateX(0px) translateY(0px);
	}
	50% {
		transform: translateY(-0.6600000000000001px);
	}
	100% {
		transform: translateY(0.6600000000000001px);
	}
}
#Vector1 {
	animation: .5s linear infinite normal forwards running Vector1;
	transform-box: fill-box;
	transform-origin: 50% 50%
}
@keyframes Vector1 {
	0% {
		transform: translateX(0px) rotate(0deg) translateY(0px);
	}
	50% {
		transform: translateY(1.4000000000000004px);
	}
	100% {
		transform: translateY(-1.4000000000000004px);
	}
}
#v2 {
	animation: .5s linear infinite normal forwards running v2;
	transform-box: fill-box;
	transform-origin: 50% 50%
}
@keyframes v2 {
	50% {
		transform: translateY(0px);
	}
	100% {
		transform: translateY(2px);
	}
}
#Vector {
	animation: .5s linear infinite normal forwards running Vector;
	transform-box: fill-box;
	transform-origin: 50% 50%
}
@keyframes Vector {
	0% {
		transform: rotate(0deg);
	}
	50% {
		transform: rotate(-23.189999999999998deg);
	}
	100% {
		transform: rotate(24deg);
	}
}
</style>

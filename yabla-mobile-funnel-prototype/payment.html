<!DOCTYPE html>
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title></title>
      <link rel="stylesheet" type="text/css" href="payment-style.css">
   </head>
   <body>
      <section class="aboveFold">
         <nav>
               <div class="Logo" >
                  <a href="index.html">
                 <img src="yablalogo2021.svg" onerror="this.src='yablalogo2021.png'">
                 </a>
               </div>
         </nav>
         <div class="heroTxt">
            <h1 class="qs lrgSize"> Pay 0€ and start learning today! </h1>
         </div>
         <h2 class="midSize qs"> Quick Payment </h2>
         <div class="ppl signupbtn"> <img src="paypalLogo.svg"> </div>
         <div class="gPay signupbtn"> <img src="gPayLogo.svg"> </div>
         <div class="aplPay signupbtn"> <img src="applePayLogo.svg"> </div>
         <h2 class="midSize qs"> Or input card </h2>
         <div class="input">
            <input type="text" id="input" name="Name" placeholder="Name on card" >
         </div>
         <div class="input">
            <input type="text" id="input" name="Number" placeholder="Card number" >
         </div>
         <div class="block">
            <div class="input2">
               <input type="text" id="input" name="Zip" placeholder="Zip code">
            </div>
            <div class="input2">
               <input type="text" id="input" name="Exp" placeholder="Exp. date" >
            </div>
            <div class="input2">
               <input type="text" id="input" name="Code" placeholder="CVV" >
            </div>
            <div class="btnWrap">
               <div class="sm orange btn qs" >
                  <a href="filter_list.html"> Join Now </a>
               </div>
            </div>
         </div>
         <div class="accept">
            <p> <i> * Monthly fee: 11.95€, will apply, starting XX/XX/XXXX date.</i></p>
         </div>
            <div class="spacer">
      
    </div>
      </section>
   </body>
</html>

<!DOCTYPE html>
<html lang="en" dir="ltr">
   <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <link rel="stylesheet" href="signup-style.css">
      <title> Yabla Signup Page</title>
   </head>
   <body>
      <section class="aboveFold">
         <nav>
               <div class="Logo" >
                  <a href="index.html">
                <img src="yablalogo2021.svg" onerror="this.src='yablalogo2021.png'">
                      </a>
               </div>
         </nav>
         <div class="heroTxt">
            <h1 class="qs lrgSize"> Create Your Account </h1>
            <h2 class="qs midSize"> First 15 days are free </h2>
         </div>
         <div class="fb signupbtn"> <img src="fbLogo.svg"> Sign up with Facebook </div>
         <div class="ggl signupbtn"> <img src="googleLogo.svg"> Sign up with Google </div>
         <p class="qs midSize"> Or sign up with your email... </p>
         <div class="input">
            <input type="text" id="input" name="password" placeholder="Enter email" >
         </div>
         <div class="input">
            <input type="text" id="input" name="password" placeholder="Choose password">
         </div>
         <div class="accept">
            <input class="checkbox" type="checkbox" checked=checked>
            <p style="margin-left: 8px;"> <i> I accept <a href="https://www.yabla.com/terms.php" target="_blank">T&C</a> and <a href="https://www.yabla.com/privacy.php" target="_blank">Privacy Policy</a></i></p>
         </div>
         <div class="btnWrap">
            <div class="sm orange btn qs" >
               <a class="link" href="payment.html">   Sign Up For Free </a>
            </div>
         </div>
        <div class="spacer">
       
        </div>
      </section>
      <script src="accept-t-c.js"></script>
   </body>
</html>
